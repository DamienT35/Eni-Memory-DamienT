<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX"
      crossorigin="anonymous"
    >
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
  </head>
  <body>
    <header class="container mt-3">
      <h1 class="text-center mb-3">ENI - Memory - Profil</h1>
      <nav class="navbar navbar-expand bg-dark navbar-dark rounded-4 px-3">
        <ul class="navbar-nav w-100 justify-content-around">
          <li class="nav-item">
            <a class="nav-link" href="index.html">Accueil</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="Inscription.html">S'inscrire</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="Connexion.html">Connexion</a>
          </li>
          <li class="nav-item">
            <a class="nav-link active" href="Profil.html">Profil</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="Jouer.html">Jouer</a>
          </li>
        </ul>
      </nav>
    </header>

    <main class="col-11 col-md-9 col-lg-6 mx-auto bg-dark text-white p-3 p-lg-4 my-4 rounded-3">
      <section class="text-center">
        <img
          class="mb-3"
          width="80"
          height="80"
          src="ressources/question.svg"
          alt="Avatar du profil"
        >

        <form action="" method="post">
          <fieldset>
            <legend class="h2 mb-4">Profil :</legend>

            <div class="mb-3">
              <label for="nom" class="form-label">Nom d'utilisateur* :</label>
              <input
                type="text"
                class="form-control"
                id="nom"
                name="nom"
                autofocus
                required
                placeholder="mikey"
                pattern="[A-Za-z]{2,}"
                title="Saisissez votre nom (2 caractères min.)"
              >
            </div>

            <div class="mb-3">
              <label for="email" class="form-label">Email :</label>
              <input
                type="email"
                class="form-control"
                id="email"
                name="email"
                placeholder="john.doe@mail.com"
                title="Saisissez votre adresse email"
              >
            </div>

            <div class="d-flex justify-content-center gap-2 mt-4">
              <button type="submit" class="btn btn-primary">Enregistrer</button>
              <button type="reset" class="btn btn-secondary">Annuler</button>
            </div>
          </fieldset>
        </form>

        <p class="mt-3 small text-secondary">* Champ obligatoire</p>
      </section>
    </main>
  </body>
</html>
