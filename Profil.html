<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil</title>
</head>
<body>
    <fieldset>
      <legend> Profil :</legend>
      <form action="" method="post">
        <label for="nom">Nom d'utilisateur* :</label>
        <input
          type="text"
          id="Nom"
          name="Nom"
          autofocus
          required
          placeholder="mikey"
          pattern="[A-Za-Z]{2,}"
          title="Saisissez votre nom (2 caractères min.)"
        />
        <br />
        <br />
        <label for="email"> Email : </label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="john.doe@mail.com"
          title="Saisissez votre adresse email"/>
          <input type="reset" />
        <input type="submit" />
      </form>
      <p>* champ obligatoire</p>
    </fieldset>
    
</body>
</html>
