    <fieldset height="20%" width="20%" class="bg-dark">
      <legend>Profil :</legend>
      <img
        width="5%"
        height="5%"
        src="ressources/question.svg"
        alt="Point d'interrogation"
      />
      <form action="" method="post">
        <label for="nom">Nom d'utilisateur* :</label>
        <input
          type="text"
          id="Nom"
          name="Nom"
          autofocus
          required
          placeholder="mikey"
          pattern="[A-Za-Z]{2,}"
          title="Saisissez votre nom (2 caractères min.)"
        />
        <br />
        <br />
        <label for="email"> Email : </label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="john.doe@mail.com"
          title="Saisissez votre adresse email"
        />
        <input type="creation du compte" />
        <input type="submit" />
      </form>
      <p>* champ obligatoire</p>
    </fieldset>
  </body>
